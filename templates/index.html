{% extends "base.html" %}
{% block title %}Shop{% endblock %}
{%block content %}
<section class="hero">

    <h1>Modern Flask eShop</h1>

    <p>
        Create your account and start shopping.
    </p>

    <div class="buttons">

        <a href="{{link}}" class="btn">{{text}}</a>

        <a href="/login" class="btn secondary">Login</a>

    </div>

</section>

<section class="features">

    <div class="card">

        <h2>Secure</h2>

        <p>Login required before checkout.</p>

    </div>

    <div class="card">

        <h2>Fast</h2>

        <p>Simple clean Flask structure.</p>

    </div>

    <div class="card">

        <h2>Responsive</h2>

        <p>Works on desktop and mobile.</p>

    </div>

</section>

{%endblock%}
